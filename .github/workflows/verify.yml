name: Verify atlas
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run verify
      - name: Ensure committed atlas matches editable sources
        run: git diff --exit-code -- data/generated/atlas.js
