<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sankardeva · journeys through time</title><style>body{margin:0;background:#f4efe4;color:#292820;font:15px system-ui}header,nav{padding:12px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}h1{font:25px Georgia;margin:0 auto 0 0}button,input,select{font:inherit;padding:7px}main{display:grid;grid-template-columns:2fr 1fr;gap:15px;padding:0 20px}svg{width:100%;height:65vh;background:#dfe8ea;border-radius:10px}aside{max-height:65vh;overflow:auto;background:#fffdf8;padding:15px}p{line-height:1.5}.stop{border-bottom:1px solid #ddd;padding:10px 0}.note{font-size:12px;color:#655}.land{fill:#e5dfcf;stroke:#bcb5a5;stroke-width:.6}.pin{fill:#9c3d24;stroke:white;stroke-width:1.5}.pilgrim{fill:#487fa1}text{font:11px system-ui;paint-order:stroke;stroke:#f4efe4;stroke-width:3;fill:#292820}.route{fill:none;stroke:#9c3d24;stroke-width:2;stroke-dasharray:5 5}@media(max-width:800px){main{grid-template-columns:1fr}svg{height:55vh}}</style><header><h1>Sankardeva · journeys, 1449–1568</h1><a href="index.html#y=1449&k=bhuyan">← Historical atlas</a><a href="data/sankardeva-routes.csv">Route CSV</a></header><nav><button id="play">▶ Play</button><input id="year" type="range" min="1449" max="1568" value="1517"><input id="number" type="number" min="1449" max="1568" value="1517"><select id="view"><option value="assam">Assam and Koch region</option><option value="india">All pilgrimage locations</option></select><span>Dashed links show sequence; they do not trace roads or river channels.</span></nav><main><section><svg id="map" viewBox="0 0 1000 620" role="group" aria-label="Sankardeva route map"></svg><p class="note">Red: locality evidence and adopted migration sequence. Blue: pilgrimage reference sites, with individual visit years unknown. Click a pin for its qualification.</p></section><aside id="panel"></aside></main><script>
Promise.all([fetch('data/sankardeva-routes.json').then(r=>r.json()),fetch('data/pilgrimage-countries.json').then(r=>r.json())]).then(([D,C])=>{const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let year=1517,timer;const bounds=()=> $('view').value==='india'?[67,99,7,33]:[89,95,25.8,27.5];function draw(){const [w,e,s,n]=bounds(),p=(lat,lon)=>[(lon-w)/(e-w)*1000,(n-lat)/(n-s)*620];const path=pts=>'M'+pts.map(([la,lo])=>p(la,lo).join(' ')).join('L');const active=D.points.filter(t=>year>=t.start&&year<=t.end);const locals=active.filter(t=>t.kind!=='pilgrimage'&&t.start>=1516&&!/Ganak|Barnagar|Bheladanga/.test(t.name)).sort((a,b)=>a.start-b.start);let h=C.map(c=>`<path class="land" d="${c.rings.map(r=>path(r)+'Z').join('')}"><title>${esc(c.name)} · modern outline</title></path>`).join('');if(locals.length>1)h+=`<path class="route" d="${path(locals.map(t=>[t.lat,t.lon]))}"><title>Adopted sequence connectors; exact travel tracks unresolved</title></path>`;h+=active.map(t=>{let [x,y]=p(t.lat,t.lon);return `<g data-pin="${D.points.indexOf(t)}" role="button" tabindex="0"><circle class="pin ${t.kind==='pilgrimage'?'pilgrim':''}" cx="${x}" cy="${y}" r="5"/><text x="${x+8}" y="${y-8}">${esc(t.name)}</text><title>${esc(t.note)}</title></g>`}).join('');$('map').innerHTML=h;$('panel').innerHTML=`<h2>${year}</h2><p>${esc(D.note)}</p>`+(year>=1481&&year<=1493?'<p><b>First pilgrimage, 1481–1493.</b> Switch to all pilgrimage locations. The supplied list does not establish their order.</p>':'')+active.map(t=>`<div class="stop"><b>${esc(t.name)}</b><p class="note">${esc(t.note)}</p></div>`).join('')+`<h3>Unlocated places</h3><p>${D.unlocated.map(esc).join(', ')} remain unpinned.</p><h3>Further source checks</h3>`+D.sources.map((u,i)=>`<p><a href="${u}">Source ${i+1}</a></p>`).join('');$('number').value=year;$('year').value=year;location.hash='y='+year;}function set(v){year=Math.max(1449,Math.min(1568,+v));draw()}$('year').oninput=e=>set(e.target.value);$('number').onchange=e=>set(e.target.value);$('view').onchange=draw;$('play').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('play').textContent='▶ Play'}else{timer=setInterval(()=>{if(year>=1568){clearInterval(timer);timer=null;return}set(year+1)},650);$('play').textContent='Pause'}};$('map').onclick=e=>{const pin=e.target.closest('[data-pin]');if(pin){const t=D.points[+pin.dataset.pin];$('panel').innerHTML=`<h2>${esc(t.name)}</h2><p>${esc(t.note)}</p><p>${esc(t.chronology)}</p><button id="back">Back to year</button>`;$('back').onclick=draw}};let m=/y=(\d+)/.exec(location.hash);if(m)year=Math.max(1449,Math.min(1568,+m[1]));draw();});
</script></html>
